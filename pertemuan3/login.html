<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Plus Jakarta Sans", sans-serif;
}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(to right, #89fffda4, #ef32d94d, #b3b3b396);
box-shadow:inset 0 0 50px 55px rgba(250, 249, 249, 0.5);
}

form{
background-color: #ffffff86;
    backdrop-filter: blur(5px);
    height: 450px;
    width: 350px;
    display: flex;
    flex-direction: column;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
}
form:hover{
    
    box-shadow: 0 10px 20px #00a2ff8a;
}
form .username, form .password{
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
}

form button{
    display: flex;
    margin-top: auto;
    justify-content: center;
    align-items: center;
    padding: 8px;
    border-radius: 10px;
    border: none;
    background-color: #00d9ff8f;
}
form button:hover{
    background-color: #00a2ff8a;
}

form .username input, form .password input{
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    margin-top: 9px;
    border: 2px solid #b3b3b38f;

}
form .username input:focus, form .password input:focus{
    outline: none;
    border: 2px solid #00d9ff8f;
    
    box-shadow: 0 2px 4px #00a2ff8a;
}
form .username input:hover, form .password input:hover{

    border: 2px solid #00d9ff8f;
    box-shadow: 0 2px 4px #00a2ff8a;
}
.bar{
   background-color: #dbdbdb;
height: 20px;
position: absolute;
top: 0;
left: 0;
right: 0;
padding: 6px;
display: flex;
gap: 8px;
flex-direction: row;
border-radius: 10px 10px 0 0;
}
h1{
    text-align: center;
    margin: auto;
}

.red{
    display: inline-block;
    background-color: #ff0000;
    height: 10px;
    width: 10px;
    border-radius: 50%;
    
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
}
.red:hover{    
    box-shadow: 0 0 8px #ff0000;
}
.yellow{
    display: inline-block;
    background-color: #ffff00;
    height: 10px;
    width: 10px;
    border-radius: 50%;
    
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
}
.yellow:hover{
    box-shadow: 0 0 8px #ffff00;
}
.green{
    display: inline-block;
    background-color: #00ff00;
    height: 10px;
    width: 10px;
    border-radius: 50%;
    
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
}
.green:hover{
    box-shadow: 0 0 8px #00ff00;
}
.checkbox{
    display: flex;
    height: 20px;
    position: relative;
    align-items: center;
    font-size: 14px;
}
.akun{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
}

.akun a{
    text-decoration: none;
    color: black;
    font-size: 12px;
    text-align: center;
}

.akun a:hover{
    text-decoration: underline;
}
</style>
</head>
<body>
    <form action="">
       <div class="bar"> 
        <div class="red">&nbsp;</div>
        <div class="yellow"></div>
        <div class="green"></div>
       </div>
       <h1 style="text-align: center;">LoginPage</h1>
        <div class="username">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="password">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="checkbox">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember" style="margin-left: 8px;">Remember me</label>
        </div>
        <button type="submit">Login</button>
        <div class="akun">
            <a href="forgot-password.html">Forgot Password?</a>
            <a href="register.html">Don't have an account? Register</a>
        </div>
    </form>
</body>
</html>
